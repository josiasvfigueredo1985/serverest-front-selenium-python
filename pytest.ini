[pytest]
log_cli=true  
log_level=DEBUG  
log_format = %(asctime)s %(levelname)s %(message)s  
log_date_format = %Y-%m-%d %H:%M:%S
log_file = ./reports/logs/pytest-logs.txt
addopts = -vs -rf --html-report=./reports/pytest_report
                  --title='PYTEST REPORT'
                  --clean-alluredir
                  --alluredir ./reports/allure-results
                  