natsort = "8.4.0"
numpy = "1.26.1"
opencv-python = "4.8.1.78"
pyscreenrec = "0.4"
pyscreenshot = "3.1"
pyscreeze = "0.1.29"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
