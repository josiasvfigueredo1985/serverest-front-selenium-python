[tool.poetry]
name = "serverest-front-selenium-python"
version = "0.1.0"
description = "Serverest front automation with Selenium and Python"
authors = ["Josias Valentim de Figueredo"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
allure-pytest = "2.13.2"
allure-python-commons = "2.13.2"
attrs = "23.1.0"
certifi = "2023.7.22"
cffi = "1.16.0"
colorama = "0.4.6"
h11 = "0.14.0"
idna = "3.4"
iniconfig = "2.0.0"
markupsafe = "2.1.3"
outcome = "1.3.0"
packaging = "23.2"
pillow = "10.1.0"
pluggy = "1.3.0"
pycparser = "2.21"
pysocks = "1.7.1"
pytest = "7.4.2"
pytest-html-reporter = "0.2.9"
selenium = "4.14.0"
sniffio = "1.3.0"
sortedcontainers = "2.4.0"
trio = "0.22.2"
trio-websocket = "0.11.1"
urllib3 = "2.0.7"
wsproto = "1.2.0"
build = "1.0.3"
cachecontrol = "0.13.1"
charset-normalizer = "3.3.2"
cleo = "2.1.0"
click = "8.1.7"
crashtest = "0.4.1"
distlib = "0.3.7"
dulwich = "0.21.6"
fastjsonschema = "2.18.1"
filelock = "3.13.1"
installer = "0.7.0"
jaraco-classes = "3.3.0"
keyring = "24.2.0"
more-itertools = "10.1.0"
msgpack = "1.0.7"
pexpect = "4.8.0"
pipenv-poetry-migrate = "0.5.1"
pkginfo = "1.9.6"
platformdirs = "3.11.0"
poetry = "1.7.0"
poetry-core = "1.8.1"
poetry-plugin-export = "1.6.0"
ptyprocess = "0.7.0"
pygame = "2.5.2"
pyproject-hooks = "1.0.0"
pywin32-ctypes = "0.2.2"
